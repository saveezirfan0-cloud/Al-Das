<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4f9c" />
    <title>Offline · Pulse</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #171717; }
      main { max-width: 26rem; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 16px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #555; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #1d4f9c; color: #fff; font: inherit; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #f5f5f5; } p { color: #aaa; } }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1d4f9c"/><path d="M8 33h13l5-12 8 24 6-16 4 4h12" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>You are offline</h1>
      <p>Pulse needs a connection to show patient information, so nothing is stored on this device. Check your signal or Wi-Fi, then try again. Messages you already sent are safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
